  paryab-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: paryab-tools-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - paryab_network

volumes:
  postgres_data:

networks:
  paryab_network:
    external: true
