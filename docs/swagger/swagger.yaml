basePath: /
definitions:
  app_internal_interfaces_http_dto_request.CreateCategoryRequest:
    properties:
      description:
        type: string
      image_url:
        maxLength: 500
        type: string
      is_active:
        type: boolean
      name:
        maxLength: 200
        minLength: 1
        type: string
      parent_id:
        type: string
      slug:
        maxLength: 200
        type: string
      sort_order:
        minimum: 0
        type: integer
    required:
    - name
    type: object
  app_internal_interfaces_http_dto_request.CreateCouponRequest:
    properties:
      code:
        maxLength: 50
        minLength: 3
        type: string
      discount_type:
        enum:
        - percentage
        - fixed_amount
        type: string
      discount_value:
        type: number
      expires_at:
        type: string
      is_active:
        type: boolean
      max_usage:
        type: integer
      min_order_amount:
        minimum: 0
        type: number
      note:
        maxLength: 500
        type: string
    required:
    - code
    - discount_type
    - discount_value
    type: object
  app_internal_interfaces_http_dto_request.CreateProductRequest:
    properties:
      attributes:
        items:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.ProductAttributeRequest'
        type: array
      brand:
        maxLength: 100
        type: string
      category_id:
        type: string
      description:
        type: string
      images:
        items:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.ProductImageRequest'
        maxItems: 10
        type: array
      inventory:
        $ref: '#/definitions/app_internal_interfaces_http_dto_request.ProductInventoryRequest'
      is_featured:
        type: boolean
      name:
        maxLength: 300
        minLength: 1
        type: string
      price:
        minimum: 0
        type: number
      sale_price:
        minimum: 0
        type: number
      short_description:
        maxLength: 500
        type: string
      sku:
        maxLength: 100
        minLength: 1
        type: string
      slug:
        maxLength: 300
        type: string
      status:
        enum:
        - draft
        - active
        - archived
        type: string
    required:
    - name
    - price
    - sku
    type: object
  app_internal_interfaces_http_dto_request.LoginRequest:
