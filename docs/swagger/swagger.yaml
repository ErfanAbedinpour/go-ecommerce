host: localhost:8080
info:
  contact:
    email: support@shop.com
    name: API Support
  description: REST API for the eCommerce admin panel. Supports JWT authentication
    with role-based access (admin, customer).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: eCommerce Admin API
  version: "1.0"
paths:
  /api/v1/admin/:
    get:
      description: Returns a welcome message. Requires admin role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Admin API root
      tags:
      - admin
  /api/v1/admin/categories:
    get:
      description: Get paginated categories or a nested tree with tree=true.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Sort field
        enum:
        - created_at
        - name
        - sort_order
        - updated_at
        in: query
        name: sort
        type: string
      - description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Filter by parent category ID
        in: query
        name: parent_id
        type: string
      - description: Filter by active status
        in: query
        name: is_active
        type: boolean
      - description: Return nested tree structure
        in: query
        name: tree
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.CategoryListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List categories
      tags:
      - categories
    post:
      consumes:
      - application/json
      description: Create a new product category with optional parent for hierarchy.
      parameters:
      - description: Category data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.CreateCategoryRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.CategoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create category
      tags:
      - categories
  /api/v1/admin/categories/{id}:
    delete:
      description: Soft-delete a category. Fails if it has children or assigned products.
      parameters:
      - description: Category ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "422":
