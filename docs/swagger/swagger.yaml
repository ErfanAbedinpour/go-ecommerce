basePath: /
definitions:
  app_internal_interfaces_http_dto_request.CreateProductRequest:
    properties:
      attributes:
        items:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.ProductAttributeRequest'
        type: array
      brand:
        maxLength: 100
        type: string
      category_id:
        type: string
      description:
        type: string
      images:
        items:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.ProductImageRequest'
        maxItems: 10
        type: array
      inventory:
        $ref: '#/definitions/app_internal_interfaces_http_dto_request.ProductInventoryRequest'
      is_featured:
        type: boolean
      name:
        maxLength: 300
        minLength: 1
        type: string
      price:
        minimum: 0
        type: number
      sale_price:
        minimum: 0
        type: number
      short_description:
        maxLength: 500
        type: string
      sku:
        maxLength: 100
        minLength: 1
        type: string
      slug:
        maxLength: 300
        type: string
      status:
        enum:
        - draft
        - active
        - archived
        type: string
    required:
    - name
    - price
    - sku
    type: object
  app_internal_interfaces_http_dto_request.LoginRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  app_internal_interfaces_http_dto_request.LogoutRequest:
    properties:
      refresh_token:
        type: string
    type: object
  app_internal_interfaces_http_dto_request.ProductAttributeRequest:
    properties:
      name:
        maxLength: 100
        type: string
      value:
        maxLength: 200
        type: string
    required:
    - name
    - value
    type: object
  app_internal_interfaces_http_dto_request.ProductImageRequest:
    properties:
      alt_text:
        maxLength: 200
        type: string
      sort_order:
        minimum: 0
        type: integer
      url:
        maxLength: 500
        type: string
    required:
    - url
    type: object
  app_internal_interfaces_http_dto_request.ProductInventoryRequest:
    properties:
      low_stock_threshold:
        minimum: 0
        type: integer
      quantity:
        minimum: 0
        type: integer
    type: object
  app_internal_interfaces_http_dto_request.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  app_internal_interfaces_http_dto_request.UpdateInventoryRequest:
    properties:
      adjustment_reason:
        maxLength: 200
        type: string
      low_stock_threshold:
        minimum: 0
        type: integer
      quantity:
        minimum: 0
        type: integer
    required:
    - quantity
    type: object
  app_internal_interfaces_http_dto_request.UpdateProductRequest:
    properties:
      attributes:
        items:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.ProductAttributeRequest'
        type: array
      brand:
        maxLength: 100
        type: string
      category_id:
        type: string
      description:
        type: string
      images:
        items:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.ProductImageRequest'
        maxItems: 10
        type: array
      is_featured:
        type: boolean
      name:
        maxLength: 300
        minLength: 1
        type: string
      price:
        minimum: 0
        type: number
      sale_price:
        minimum: 0
        type: number
      short_description:
        maxLength: 500
        type: string
      sku:
        maxLength: 100
        minLength: 1
        type: string
      slug:
        maxLength: 300
        type: string
      status:
        enum:
        - draft
        - active
        - archived
        type: string
    type: object
  app_internal_interfaces_http_dto_response.CurrentUserResponse:
    properties:
      email:
        example: admin@shop.com
        type: string
      first_name:
        example: Admin
        type: string
      id:
        example: c0000000-0000-0000-0000-000000000001
        type: string
      last_name:
        example: User
        type: string
      phone:
        example: "+1234567890"
        type: string
      role:
        enum:
        - admin
        - customer
        example: admin
        type: string
    type: object
  app_internal_interfaces_http_dto_response.ErrorBody:
    properties:
      code:
        example: VALIDATION_ERROR
        type: string
      details:
        additionalProperties:
          type: string
        type: object
      message:
        example: request validation failed
        type: string
    type: object
  app_internal_interfaces_http_dto_response.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorBody'
      path:
        example: /api/v1/auth/login
        type: string
      statusCode:
        example: 400
        type: integer
    type: object
  app_internal_interfaces_http_dto_response.HealthResponse:
    properties:
      status:
        example: ok
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  app_internal_interfaces_http_dto_response.MessageResponse:
    properties:
      message:
        example: ecommerce admin API v1
        type: string
    type: object
  app_internal_interfaces_http_dto_response.ProductAttributeResponse:
    properties:
      id:
        type: string
      name:
        type: string
      value:
        type: string
    type: object
  app_internal_interfaces_http_dto_response.ProductImageResponse:
    properties:
      alt_text:
        type: string
      id:
        type: string
      sort_order:
        type: integer
      url:
        type: string
    type: object
  app_internal_interfaces_http_dto_response.ProductInventoryResponse:
    properties:
      is_low_stock:
        type: boolean
      is_out_of_stock:
        type: boolean
      low_stock_threshold:
        type: integer
      quantity:
        type: integer
    type: object
  app_internal_interfaces_http_dto_response.ProductListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/app_internal_interfaces_http_dto_response.ProductResponse'
        type: array
      meta:
        $ref: '#/definitions/app_pkg_pagination.Meta'
    type: object
  app_internal_interfaces_http_dto_response.ProductResponse:
    properties:
      attributes:
        items:
          $ref: '#/definitions/app_internal_interfaces_http_dto_response.ProductAttributeResponse'
        type: array
      brand:
        type: string
      category_id:
        type: string
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/app_internal_interfaces_http_dto_response.ProductImageResponse'
        type: array
      inventory:
        $ref: '#/definitions/app_internal_interfaces_http_dto_response.ProductInventoryResponse'
      is_featured:
        type: boolean
      name:
        type: string
      price:
        type: number
      sale_price:
        type: number
      short_description:
        type: string
      sku:
        type: string
      slug:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  app_internal_interfaces_http_dto_response.ReadinessResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        example: ready
        type: string
      version:
        example: 1.0.0
        type: string
    type: object
  app_internal_interfaces_http_dto_response.TokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      expires_in:
        example: 900
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIs...
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  app_pkg_pagination.Meta:
    properties:
      page:
        type: integer
      per_page:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@shop.com
    name: API Support
  description: REST API for the eCommerce admin panel. Supports JWT authentication
    with role-based access (admin, customer).
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: eCommerce Admin API
  version: "1.0"
paths:
  /api/v1/admin/:
    get:
      description: Returns a welcome message. Requires admin role.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.MessageResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Admin API root
      tags:
      - admin
  /api/v1/admin/products:
    get:
      description: Get a paginated list of products with optional filters.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Sort field
        enum:
        - created_at
        - name
        - price
        - updated_at
        in: query
        name: sort
        type: string
      - description: Sort order
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Filter by status
        enum:
        - draft
        - active
        - archived
        in: query
        name: status
        type: string
      - description: Filter by category
        in: query
        name: category_id
        type: string
      - description: Filter by brand
        in: query
        name: brand
        type: string
      - description: Filter featured products
        in: query
        name: is_featured
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ProductListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List products
      tags:
      - products
    post:
      consumes:
      - application/json
      description: Create a new product with images, attributes, and inventory.
      parameters:
      - description: Product data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.CreateProductRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create product
      tags:
      - products
  /api/v1/admin/products/{id}:
    delete:
      description: Soft-delete a product. Fails if referenced by active orders.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete product
      tags:
      - products
    get:
      description: Get a product by ID with images, attributes, and inventory.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ProductResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get product
      tags:
      - products
    put:
      consumes:
      - application/json
      description: Update an existing product. Supports partial updates.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Product data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.UpdateProductRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ProductResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update product
      tags:
      - products
  /api/v1/admin/products/{id}/inventory:
    patch:
      consumes:
      - application/json
      description: Adjust stock quantity and low-stock threshold for a product.
      parameters:
      - description: Product ID
        in: path
        name: id
        required: true
        type: string
      - description: Inventory data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.UpdateInventoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ProductInventoryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Update product inventory
      tags:
      - products
  /api/v1/admin/products/search:
    get:
      description: Search products by name, SKU, or description.
      parameters:
      - description: Search query (min 2 chars)
        in: query
        name: q
        required: true
        type: string
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ProductListResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Search products
      tags:
      - products
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate with email and password. Returns JWT access and refresh
        tokens.
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      summary: Login
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Revoke the refresh token family. Requires a valid access token.
      parameters:
      - description: Optional refresh token to revoke
        in: body
        name: body
        schema:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.LogoutRequest'
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Logout
      tags:
      - auth
  /api/v1/auth/me:
    get:
      description: Returns the profile of the authenticated user.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.CurrentUserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current user
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access/refresh token pair.
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/app_internal_interfaces_http_dto_request.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.TokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ErrorResponse'
      summary: Refresh token
      tags:
      - auth
  /healthz:
    get:
      description: Returns 200 if the process is alive. Used by orchestrators for
        liveness checks.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.HealthResponse'
      summary: Liveness probe
      tags:
      - health
  /readyz:
    get:
      description: Returns 200 if all dependencies (database) are healthy, 503 otherwise.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ReadinessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/app_internal_interfaces_http_dto_response.ReadinessResponse'
      summary: Readiness probe
      tags:
      - health
securityDefinitions:
  BearerAuth:
    description: 'Enter "Bearer" followed by a space and the JWT access token. Example:
      Bearer eyJhbGciOiJIUzI1NiIs...'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
