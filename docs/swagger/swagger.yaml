info:
  contact:
    email: support@shop.com
    name: API Support
  description: REST API for the eCommerce admin panel and public storefront. Supports
    JWT authentication with role-based access (admin, customer). Store endpoints under
    /api/v1/store are public; account routes require a customer token.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: eCommerce API
  version: "1.0"
